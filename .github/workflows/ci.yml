name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          global-json-file: global.json

      - name: Restore
        run: dotnet restore squalify.sln

      - name: Build
        run: dotnet build squalify.sln -c Release --no-restore

      - name: Test
        run: dotnet test squalify.sln -c Release --no-build --no-restore --filter "Category!=Corpus&Category!=Package&Category!=Large"

      - name: Package
        run: dotnet test squalify.sln -c Release --no-build --no-restore --filter "Category=Package"

      - name: Format
        run: dotnet format squalify.sln --verify-no-changes
